# Variante de docker-compose.yml utilisant les images pré-construites publiées sur GHCR (voir
# .github/workflows/docker-publish.yml) au lieu de "build:". Ne nécessite pas de cloner le dépôt :
# seuls ce fichier et .env (copié depuis .env.example) sont utiles.
#
# Usage :
#   docker compose -f docker-compose.images.yml up -d
#
# Compatible Portainer (Stacks) : coller ce fichier dans l'éditeur web, ou pointer vers son URL
# raw sur GitHub — Portainer pull les images sans jamais builder.
#
# IMAGE_TAG (dans .env) : version à déployer (ex. "2.0.1"). Défaut "latest" (dernier tag publié).
services:
  db:
    image: ghcr.io/boleqs/cantisa-money-db:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: cmm
    volumes:
      - db_data:/var/lib/postgresql/data
      - instance_data:/instance
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/boleqs/cantisa-money-backend:${IMAGE_TAG:-latest}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_NAME: cmm
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
      PWD_PEPPER: ${PWD_PEPPER:-}
      RESET_DB_ON_START: ${RESET_DB_ON_START:-false}
      DEMO_DATA: ${DEMO_DATA:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      JWT_COOKIE_CSRF_PROTECT: ${JWT_COOKIE_CSRF_PROTECT:-true}
      API_PORT: ${API_PORT:-5000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      ENABLE_BANKING_REDIRECT_URL: ${ENABLE_BANKING_REDIRECT_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - certs_data:/app/backend/certs
      - instance_data:/app/backend/instance

  frontend:
    image: ghcr.io/boleqs/cantisa-money-frontend:${IMAGE_TAG:-latest}
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
    volumes:
      - certs_data:/certs:ro
    depends_on:
      - backend

  caddy:
    image: ghcr.io/boleqs/cantisa-money-caddy:${IMAGE_TAG:-latest}
    environment:
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      EDGE_HTTPS: ${EDGE_HTTPS:-true}
      EDGE_ACME_DOMAIN: ${EDGE_ACME_DOMAIN:-}
      EDGE_ACME_EMAIL: ${EDGE_ACME_EMAIL:-}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      API_PORT: ${API_PORT:-5000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - certs_data:/certs:ro
      # Certificat "edge" fourni par l'utilisateur (voir TLS_CERT_PATH) : décommenter et adapter
      # le chemin hôte. Ex. avec TLS_CERT_PATH=/etc/caddy-certs/fullchain.pem :
      # - ./mes-certs:/etc/caddy-certs:ro

volumes:
  db_data:
  certs_data:
  instance_data:
  caddy_data:
  caddy_config:
